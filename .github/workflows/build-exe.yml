name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 reportlab openpyxl python-docx Pillow pyinstaller

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name HSE-Management-System app/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System
          path: dist/HSE-Management-System.exe
