on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6
          python -m pip install reportlab
          python -m pip install openpyxl
          python -m pip install Pillow
          python -m pip install pyinstaller

      - name: Verify source
        shell: pwsh
        run: |
          $content = Get-Content "app/main.py" -Raw

          if ($content -match "from PySide6\.QtGui import.*QRectF") {
            Write-Host "ERROR: QRectF is still imported from QtGui."
            exit 1
          }

          if ($content -notmatch "from PySide6\.QtCore import.*QRectF") {
            Write-Host "ERROR: QRectF is not imported from QtCore."
            exit 1
          }

          Write-Host "QRectF import is correct."

      - name: Test Python source
        shell: pwsh
        run: |
          python -m py_compile app/main.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name "HSE-Management-System" `
            app/main.py

      - name: Check EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/HSE-Management-System.exe")) {
            Write-Host "EXE was not created."
            exit 1
          }

          $size = (Get-Item "dist/HSE-Management-System.exe").Length
          Write-Host "EXE created successfully."
          Write-Host "Size: $size bytes"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-Windows
          path: dist/HSE-Management-System.exe
          if-no-files-found: error
