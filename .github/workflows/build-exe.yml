name: Build HSE Management System EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 reportlab openpyxl python-docx Pillow pyinstaller

      - name: Verify source
        shell: pwsh
        run: |
          $bad = Select-String -Path "app/main.py" -Pattern "QRecF"
          if ($bad) {
            Write-Host "ERROR: app/main.py still contains QRecF."
            exit 1
          }
          Write-Host "OK: QRecF not found."

      - name: Build EXE
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name HSE-Management-System app/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-Windows
          path: dist/HSE-Management-System.exe
