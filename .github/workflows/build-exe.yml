name: Build HSE Management System EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          python -m pip install pyinstaller

      - name: Check Python source
        shell: pwsh
        run: |
          python -m py_compile main.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "HSE-Management-System" `
            --clean `
            main.py

      - name: Check generated EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/HSE-Management-System.exe")) {
            Write-Error "EXE was not created."
            exit 1
          }

          Get-Item "dist/HSE-Management-System.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-Windows
          path: dist/HSE-Management-System.exe
          if-no-files-found: error
