name: Build HSE Management System EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Check source
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.py
          $bad = $files | Select-String "QRecF"
          if ($bad) {
            Write-Host "ERROR: QRecF found."
            exit 1
          }
          Write-Host "Source check passed."

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name HSE-Management-System app/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Management-System-Windows
          path: dist/HSE-Management-System.exe
